name: Journalism Quality Filter

# Opt in to the Node.js 24 runtime for JavaScript-based GitHub Actions now.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Run weekly on Fridays at 10:00 UTC = 3:00 AM MST / 4:00 AM MDT (Denver)
    - cron: "0 10 * * 5"
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Journalism Quality Filter
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS || '["https://audioboom.com/channels/5114286.rss","https://feeds.simplecast.com/82FI35Px","https://feeds.megaphone.fm/DISPME9513417677","https://feeds.megaphone.fm/BVLLC2163264914","https://feeds.simplecast.com/WCb5SgYj"]' }}
          MAX_ENTRIES_PER_FEED: ${{ vars.MAX_ENTRIES_PER_FEED || '25' }}
          BATCH_SIZE: ${{ vars.BATCH_SIZE || '10' }}
          FEED_RETENTION_DAYS: ${{ vars.FEED_RETENTION_DAYS || '14' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '7' }}
        run: python journalism_filter.py

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml data/seen.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update journalism feed [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
